# .github/workflows/deploy.yml

name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4          # ✅ already v4, add env var below

      - name: Setup Pages
        uses: actions/configure-pages@v5   # ✅ already v5, add env var below

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3  # ✅ use v3 (Node 24 compatible)
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4      # ✅ v4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # ✅ opt in to Node 24 now
